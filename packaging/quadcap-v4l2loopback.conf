# The virtual camera OBS reads quadcap's video from.
#
# card_label is how quadcap finds this node: the capture card is itself a /dev/video node and the
# numbering depends on probe order, so writing to a fixed path could mean writing into the card.
# exclusive_caps makes the node advertise capture capability only once something is feeding it,
# which is what stops OBS from listing an empty device and opening it by mistake.
options v4l2loopback devices=1 video_nr=10 card_label=quadcap exclusive_caps=1 max_buffers=2
