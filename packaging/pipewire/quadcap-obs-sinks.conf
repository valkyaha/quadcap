# Two null sinks so OBS receives console audio and the microphone as separate inputs.
#
# quadcap writes one source to each. OBS adds them with Audio Output Capture, picking the monitor
# of each sink, which is what allows the game to be ducked under a microphone, or the microphone to
# be filtered, without either affecting the other. A single mixed sink would make that impossible.
#
# These are declared here rather than created by the application so they survive a reboot and are
# present in the OBS source list before quadcap is even started.
context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "quadcap-game"
            node.description        = "quadcap game audio"
            media.class             = Audio/Sink
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
            object.linger           = true
        }
    }
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "quadcap-mic"
            node.description        = "quadcap microphone"
            media.class             = Audio/Sink
            audio.position          = [ FL FR ]
            monitor.channel-volumes = true
            object.linger           = true
        }
    }
]
